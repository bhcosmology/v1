<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  constructor(p){
    super(p);
    this.docs = [
      { key:'a1', tag:'Annex I',  gK:'doc1Tag', tK:'doc1Title', mK:'doc1Meta', aK:'doc1Abstract', hasText:true },
      { key:'a2', tag:'Annex II', gK:'doc2Tag', tK:'doc2Title', mK:'doc2Meta', aK:'doc2Abstract', hasText:true },
      { key:'a3', tag:'Resum',    gK:'doc3Tag', tK:'doc3Title', mK:'doc3Meta', hasText:true, isSummary:true },
    ];
    this.cur = 0;
  }
  componentDidMount(){
    this.i18n();
    this.makeStars();
    this.buildAnchorIndex();
    // un enllaç permanent (#id-de-secció) pot apuntar a qualsevol dels tres documents
    const want = this.anchorFromHash();
    if(want && this._anchors[want] !== undefined) this.cur = this._anchors[want];
    this.render();
    if(want) this.goTo(want, false);
    this._onScroll = () => this.onScroll();
    window.addEventListener('scroll', this._onScroll, { passive:true });
    this._onHash = () => {
      const id = this.anchorFromHash();
      if(!id || this._anchors[id]===undefined) return;
      if(this._anchors[id] !== this.cur){ this.cur = this._anchors[id]; this.render(); }
      this.goTo(id, false);
    };
    window.addEventListener('hashchange', this._onHash);
  }
  componentWillUnmount(){
    if(this._onScroll) window.removeEventListener('scroll', this._onScroll);
    if(this._onHash) window.removeEventListener('hashchange', this._onHash);
  }
  anchorFromHash(){
    try { return decodeURIComponent(String(location.hash||'').replace(/^#/,'')) || null; }
    catch(e){ return null; }
  }
  // id d'àncora -> índex del document que la conté (les 188 són úniques)
  buildAnchorIndex(){
    const map = {};
    this.docs.forEach((doc,i)=>{
      const data = doc.isSummary
        ? ((window.BHC_SUMMARY||{}).ca)
        : (window.BHC_DOCS||{})[doc.key];
      if(!data || !data.sections) return;
      data.sections.forEach(s=>{
        if(s.id) map[s.id]=i;
        (s.blocks||[]).forEach(b=>{ if(b.t==='h' && b.id) map[b.id]=i; });
      });
    });
    this._anchors = map;
  }
  setHash(id){
    if(!id || this._lastHash===id) return;
    this._lastHash = id;
    try { history.replaceState(null,'','#'+encodeURIComponent(id)); } catch(e){}
  }
  i18n(){ if(!window.BHC_applyI18n) return; window.BHC_applyI18n(); requestAnimationFrame(()=>window.BHC_applyI18n()); }
  makeStars(){
    const sl=document.getElementById('pageStars'); if(!sl||sl.children.length) return;
    let h='';
    for(let i=0;i<40;i++){
      const x=(Math.random()*100).toFixed(2), y=(Math.random()*100).toFixed(2);
      const s=(Math.random()*0.9+0.5).toFixed(2);
      const o=(Math.random()*0.22+0.12).toFixed(2);
      const d=(Math.random()*6+5).toFixed(2), dl=(Math.random()*8).toFixed(2);
      h+='<span style="position:absolute;left:'+x+'%;top:'+y+'%;width:'+s+'px;height:'+s+'px;border-radius:50%;background:#f4f1ea;--o:'+o+';opacity:'+o+';box-shadow:0 0 3px 0 #f4f1ea44;animation:twinkle '+d+'s ease-in-out '+dl+'s infinite"></span>';
    }
    sl.innerHTML=h;
  }
  T(k){ return window.t ? window.t(k) : ''; }
  esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  select(i){
    if(i===this.cur) return;
    this.cur=i; this._lastHash=null;
    try { history.replaceState(null,'',location.pathname+location.search); } catch(e){}
    this.render(); window.scrollTo({top:0,behavior:'smooth'});
  }

  render(){
    const d = this.docs[this.cur];
    const T = k=>this.T(k);
    // the summary exists in all three languages; the annexes are Catalan only
    const lang = window.BHC_LANG || 'en';
    const summary = d.isSummary ? ((window.BHC_SUMMARY||{})[lang] || (window.BHC_SUMMARY||{}).ca) : null;
    const data = d.isSummary ? summary : (window.BHC_DOCS||{})[d.key];

    // ── document switcher ──
    const list = document.getElementById('doclist');
    list.innerHTML = '';
    this.docs.forEach((doc,i)=>{
      const on = i===this.cur;
      const b=document.createElement('button');
      b.className='doccard';
      b.style.cssText += on
        ? 'background:#0d0c13;border:1px solid #2a2833;'
        : 'background:transparent;border:1px solid var(--line-2);';
      b.innerHTML =
        '<div style="font:600 10.5px/1 ui-monospace,Menlo,monospace;color:'+(on?'var(--gold)':'var(--t6)')+';margin-bottom:8px;letter-spacing:.12em">'+this.esc(T(doc.gK)||doc.tag).toUpperCase()+'</div>'
        + '<div style="font-weight:600;font-size:15px;letter-spacing:-.01em;color:'+(on?'var(--ink)':'#a8a49b')+'">'+this.esc(T(doc.tK)||doc.tag)+'</div>'
        + '<div style="margin-top:5px;font-size:12.2px;color:var(--t6);line-height:1.35">'+this.esc(T(doc.mK))+'</div>';
      b.addEventListener('click',()=>this.select(i));
      list.appendChild(b);
    });

    // ── header ──
    document.getElementById('docTag').textContent = T(d.gK)||d.tag;
    document.getElementById('docTitle').textContent = summary ? summary.title : (T(d.tK)||d.tag);
    document.getElementById('docStatus').textContent = d.hasText ? T('draftLabel') : T('notPublished');
    document.getElementById('docAbstract').textContent = summary ? summary.lead
      : (d.hasText ? (T(d.aK) || T('docsDraftNote')) : T('docsSoon'));

    // enllaç a la versió estàtica: la que llegeixen els cercadors i la que es pot imprimir
    const st = document.getElementById('docStatic');
    if(st){
      const slug = {a1:'annex-1', a2:'annex-2', a3:'resum'}[d.key];
      if(slug && d.hasText){
        st.style.display='inline-block';
        st.href = slug+'.'+lang+'.html';
        st.textContent = (T('readStatic')||'Full text on one page')+' →';
      } else st.style.display='none';
    }

    // ── translation notice (the summary is fully translated, so it never needs one) ──
    const notice = document.getElementById('docNotice');
    const trAll = (!d.isSummary && lang!=='ca')
      ? (((window.BHC_DOCS_I18N||{})[d.key]||{})[lang]||{}) : {};
    const nDone = Object.keys(trAll).length;
    const nTotal = (data && data.sections) ? data.sections.length : 0;
    if(d.hasText && !d.isSummary && lang!=='ca'){
      notice.style.display='block';
      const msg = nDone===0 ? T('docsLangNotice')
                : (nDone>=nTotal ? '' : T('docsPartial').replace('{done}',nDone).replace('{total}',nTotal));
      if(!msg){ notice.style.display='none'; }
      else {
        notice.innerHTML='<div style="display:inline-flex;align-items:center;gap:10px;padding:10px 16px;border:1px solid var(--line-2);border-radius:999px;font-size:12.5px;color:var(--t4)">'
          +'<span style="width:6px;height:6px;border-radius:50%;background:var(--gold);display:inline-block"></span>'
          +'<span>'+this.esc(msg)+'</span></div>';
      }
    } else notice.style.display='none';

    // ── body ──
    const body = document.getElementById('docBody');
    if(!d.hasText || !data){
      body.innerHTML = '<p><em>'+this.esc(T('placeholderNote'))+'</em></p>';
      document.getElementById('tocwrap').innerHTML='';
      this.typeset();
      return;
    }
    // translations for this document, if any (Catalan is the source)
    const tr = (!d.isSummary && lang!=='ca')
      ? (((window.BHC_DOCS_I18N||{})[d.key]||{})[lang]||{}) : {};
    this._tr = tr;

    let html='';
    data.sections.forEach(s=>{
      const ts = tr[s.id];                     // translated section, or undefined
      const tb = (ts && ts.blocks) || {};
      const plink = id => '<a class="plink" data-plink="'+this.esc(id)+'" href="#'+encodeURIComponent(id)+'" title="'+this.esc(T('copyLink')||'Copy link to this section')+'">#</a>';
      html += '<section class="sec" id="'+s.id+'"><h2>'+this.esc((ts&&ts.title)||s.title)+plink(s.id)+'</h2>';
      s.blocks.forEach((b,bi)=>{
        const t = tb[bi];                      // translated text for this block
        if(b.t==='p') html += '<p>'+(t||b.html)+'</p>';
        else if(b.t==='h') html += '<h3 id="'+(b.id||'')+'">'+this.esc(t||b.text)+(b.id?plink(b.id):'')+'</h3>';
        else if(b.t==='ul') html += '<ul>'+(t||b.items).map(x=>'<li>'+x+'</li>').join('')+'</ul>';
        else if(b.t==='table'){
          html += '<div class="tablewrap"><table>'
            + b.rows.map((r,ri)=>'<tr>'+r.map(c=>{
                const cell=this.esc(c);
                return ri===0 ? '<th>'+cell+'</th>' : '<td>'+cell+'</td>';
              }).join('')+'</tr>').join('')
            + '</table></div>';
        }
        else if(b.t==='eq'){
          html += b.tex
            ? '<div class="eq">$$'+b.tex+'$$</div>'
            : '<div class="eq pending"><code>'+this.esc(b.raw)+'</code><span class="tagline">'+this.esc(T('eqPending'))+'</span></div>';
        }
      });
      html += '</section>';
    });
    body.innerHTML = html;

    // els botons «#» copien l'enllaç permanent en comptes de saltar-hi
    body.querySelectorAll('.plink').forEach(a=>{
      a.addEventListener('click',ev=>{ ev.preventDefault(); this.copyLink(a.dataset.plink, a); });
    });

    // ── table of contents ──
    const toc = document.getElementById('tocwrap');
    toc.innerHTML='';
    data.sections.forEach(s=>{
      const ts = (this._tr||{})[s.id];
      const tb = (ts && ts.blocks) || {};
      const a=document.createElement('button');
      a.className='toclink'; a.dataset.target=s.id; a.textContent=(ts&&ts.title)||s.title;
      a.addEventListener('click',()=>this.goTo(s.id));
      toc.appendChild(a);
      s.blocks.forEach((b,bi)=>{
        if(b.t!=='h' || !b.id) return;
        const sub=document.createElement('button');
        sub.className='toclink sub'; sub.dataset.target=b.id; sub.textContent=tb[bi]||b.text;
        sub.addEventListener('click',()=>this.goTo(b.id));
        toc.appendChild(sub);
      });
    });

    this.typeset();
    this.onScroll();
  }

  goTo(id, smooth){
    const el=document.getElementById(id);
    if(!el){ // el cos encara no s'ha pintat: reintenta un cop
      if(smooth!==false) return;
      setTimeout(()=>{ const e2=document.getElementById(id);
        if(e2) window.scrollTo({top:e2.getBoundingClientRect().top+window.scrollY-92}); },120);
      return;
    }
    window.scrollTo({top: el.getBoundingClientRect().top+window.scrollY-92,
                     behavior: smooth===false ? 'auto' : 'smooth'});
    this.setHash(id);
  }
  // copia l'enllaç permanent al porta-retalls i deixa marca visual
  copyLink(id, node){
    this.setHash(id);
    const url = location.href;
    const done = () => {
      if(!node) return;
      const old = node.textContent; node.textContent='✓'; node.classList.add('copied');
      setTimeout(()=>{ node.textContent=old; node.classList.remove('copied'); },1200);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done, done);
    } else done();
  }

  onScroll(){
    // reading progress
    const h=document.documentElement;
    const max=h.scrollHeight-h.clientHeight;
    const bar=document.getElementById('readbar');
    if(bar) bar.style.width = (max>0 ? Math.min(100,(h.scrollTop/max)*100) : 0)+'%';

    // scroll-spy on the TOC
    const links=[...document.querySelectorAll('.toclink')];
    if(!links.length) return;
    let best=null, bestTop=-1e9;
    links.forEach(l=>{
      const el=document.getElementById(l.dataset.target); if(!el) return;
      const top=el.getBoundingClientRect().top-120;
      if(top<=0 && top>bestTop){ bestTop=top; best=l; }
    });
    links.forEach(l=>l.classList.toggle('on', l===best));
    if(best && this._lastSpy!==best){
      this._lastSpy=best;
      // la URL segueix la lectura, així es pot copiar de la barra en qualsevol moment
      this.setHash(best.dataset.target);
      const w=document.getElementById('tocwrap');
      const lt=best.offsetTop-w.offsetTop;
      if(lt<w.scrollTop || lt>w.scrollTop+w.clientHeight-40) w.scrollTop=lt-w.clientHeight/2;
    }
  }

  typeset(){
    const run=()=>{
      if(window.MathJax && window.MathJax.typesetPromise){
        const el=document.getElementById('docBody');
        window.MathJax.typesetClear && window.MathJax.typesetClear();
        window.MathJax.typesetPromise(el?[el]:undefined).catch(()=>{});
      } else setTimeout(run,250);
    };
    setTimeout(run,60);
  }
  renderVals(){ return {}; }
}
</script>
</body>
</html>
